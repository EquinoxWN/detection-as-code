title: Certutil Used to Download a File
id: f9772360-3499-573e-84b9-3bfd78c8ce0d
status: experimental
description: >
  Detects certutil.exe fetching a remote URL with -urlcache or -verifyctl. The built-in certificate
  tool is a well-known "living off the land" way to pull payloads past application allow-lists.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1105/T1105.md
author: AUTHOR_NAME
owner: detection-engineering
date: 2026-09-30
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith: '\certutil.exe'
    - OriginalFileName: 'CertUtil.exe'
  selection_download:
    CommandLine|contains:
      - 'urlcache'
      - 'verifyctl'
  selection_remote:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
  condition: 1 of selection_image and selection_download and selection_remote
falsepositives:
  - Administrators refreshing certificate revocation lists by hand (rare; no URL argument in normal use).
level: high
